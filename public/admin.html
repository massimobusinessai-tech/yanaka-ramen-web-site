<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanaka Ramen — Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: var(--light-gray);
            padding-top: 0;
        }
        .admin-nav {
            background: var(--black);
            color: var(--white);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-nav h1 {
            font-family: var(--font-primary);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .admin-nav h1 a {
            color: var(--white);
            text-decoration: none;
        }
        .admin-nav h1 span {
            color: var(--yanaka-red);
        }
        .admin-nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .admin-nav-actions button {
            background: none;
            border: 1px solid rgba(255,255,255,0.3);
            color: var(--white);
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: var(--font-secondary);
            transition: all 0.2s ease;
        }
        .admin-nav-actions button:hover {
            border-color: var(--white);
        }
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        #login-view {
            display: none;
        }
        #dashboard-view {
            display: none;
        }

        /* Tabs */
        .admin-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e0e0e0;
        }
        .admin-tab {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-family: var(--font-primary);
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            background: none;
            color: #888;
            position: relative;
            transition: color 0.2s;
        }
        .admin-tab:hover {
            color: var(--yanaka-red);
        }
        .admin-tab.active {
            color: var(--yanaka-red);
        }
        .admin-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--yanaka-red);
        }
        .admin-tab-badge {
            display: inline-block;
            background: var(--yanaka-red);
            color: white;
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
            margin-left: 0.4rem;
            min-width: 1.2rem;
            text-align: center;
        }
        .admin-tab-content {
            display: none;
        }
        .admin-tab-content.active {
            display: block;
        }

        /* Completed orders - daily groups */
        .completed-day-group {
            margin-bottom: 1.5rem;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .completed-day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--yanaka-red);
            color: white;
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 0.95rem;
        }
        .completed-day-summary {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        .completed-day-orders {
            padding: 0.5rem;
        }
        .completed-order-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }
        .completed-order-card:last-child {
            border-bottom: none;
        }
        .completed-order-card:hover {
            background: #fafafa;
        }
        .completed-order-left {
            flex: 1;
        }
        .completed-order-id {
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--black);
        }
        .completed-order-customer {
            font-size: 0.8rem;
            color: #555;
            margin-top: 0.15rem;
        }
        .completed-order-items {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.1rem;
        }
        .completed-order-right {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }
        .completed-order-time {
            font-size: 0.8rem;
            color: #666;
        }
        .completed-order-total {
            font-family: var(--font-primary);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--yanaka-red);
            min-width: 4rem;
            text-align: right;
        }
        .completed-order-delete {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.2rem 0.4rem;
            opacity: 0.4;
            transition: opacity 0.2s;
        }
        .completed-order-delete:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="admin-nav">
        <h1><a href="/">🍜</a> Yanaka <span>Admin</span></h1>
        <div class="admin-nav-actions">
            <button id="test-telegram-btn" style="display:none">📨 Test Telegram</button>
            <a href="/" style="color:rgba(255,255,255,0.5);font-size:0.85rem;text-decoration:none">← Sito</a>
            <button id="logout-btn" style="display:none">Logout</button>
        </div>
    </div>

    <!-- Login View -->
    <div class="admin-login-form" id="login-view">
        <h2>🔐 Accesso Admin</h2>
        <p style="color:#666;margin-bottom:1.5rem;font-size:0.9rem">
            Inserisci la password per gestire gli ordini
        </p>
        <input type="password" id="admin-password" placeholder="Password" autocomplete="current-password">
        <div class="admin-login-error" id="login-error"></div>
        <button class="btn btn-primary" id="login-btn" style="width:100%">Accedi</button>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view">
        <div class="admin-container">
            <div class="admin-stats">
                <div class="admin-stat-card">
                    <div class="admin-stat-number" id="stat-total">0</div>
                    <div class="admin-stat-label">Totale Ordini</div>
                </div>
                <div class="admin-stat-card">
                    <div class="admin-stat-number" id="stat-pending">0</div>
                    <div class="admin-stat-label">Da Preparare</div>
                </div>
                <div class="admin-stat-card">
                    <div class="admin-stat-number" id="stat-preparing">0</div>
                    <div class="admin-stat-label">In Corso</div>
                </div>
                <div class="admin-stat-card">
                    <div class="admin-stat-number" id="stat-completed">0</div>
                    <div class="admin-stat-label">Completati</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="active">
                    📋 Ordini Attivi
                    <span class="admin-tab-badge" id="tab-active-count">0</span>
                </button>
                <button class="admin-tab" data-tab="completed">
                    ✅ Completati
                    <span class="admin-tab-badge" id="tab-completed-count">0</span>
                </button>
            </div>

            <!-- Active Orders Tab -->
            <div class="admin-tab-content active" id="tab-content-active">
                <div id="orders-container">
                    <p class="admin-no-orders">Caricamento ordini...</p>
                </div>
            </div>

            <!-- Completed Orders Tab -->
            <div class="admin-tab-content" id="tab-content-completed">
                <div id="completed-orders-container">
                    <p class="admin-no-orders">Caricamento ordini completati...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>

</body>
</html>
