[build]
  functions = "netlify/functions"

# Redirect API paths to Netlify Functions
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200
  conditions = {Method = "POST"}

[[redirects]]
  from = "/api/order-status"
  to = "/.netlify/functions/order-status"
  status = 200

[[redirects]]
  from = "/api/order/*"
  to = "/.netlify/functions/order-status"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/order-status"
  status = 200

# SPA fallback: serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200